version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://hubsphere:${DB_PASSWORD:-hubsphere_secure_password}@postgres:5432/hubsphere
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-change_me_in_production}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubsphere
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hubsphere_secure_password}
      POSTGRES_DB: hubsphere
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubsphere -d hubsphere"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
